name: Build desktop packages
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            arch: x64
            target: windows-x64
          - os: macos-15
            arch: arm64
            target: macos-arm64
          - os: macos-15-intel
            arch: x64
            target: macos-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          architecture: ${{ matrix.arch }}
          cache: pip
      - run: python -m pip install -r requirements-build.txt
      - run: python -X utf8 -m unittest -v
      - run: node scripts/test-ui-startup.cjs
      - name: Build Windows application
        if: runner.os == 'Windows'
        run: python -m PyInstaller --noconfirm FactorySwitch.windows.spec
      - name: Build macOS application
        if: runner.os == 'macOS'
        run: python -m PyInstaller --noconfirm FactorySwitch.mac.spec
      - name: Smoke test frozen application
        run: python scripts/smoke_package.py
      - name: Create Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\windows.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Create macOS disk image
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          mkdir -p dist/dmg dist/release
          ditto "dist/Factory Switch.app" "dist/dmg/Factory Switch.app"
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname "Factory Switch" -srcfolder dist/dmg -ov -format UDZO "dist/release/FactorySwitch-0.2.0-${TARGET}.dmg"
          hdiutil verify "dist/release/FactorySwitch-0.2.0-${TARGET}.dmg"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14
